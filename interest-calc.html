<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단리 이자 계산기</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      padding: 10px;
      margin: 0;
      max-width: 480px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: #007bff;
      margin: 10px 0;
      font-size: 20px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-top: 12px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      margin-top: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      font-size: 16px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>📈 단리 이자 계산기</h2>

  <label for="principal">예치금 (원)</label>
  <input type="number" id="principal" placeholder="예: 10000000" inputmode="numeric" />

  <label for="rate">연 이자율 (%)</label>
  <input type="number" id="rate" step="0.01" placeholder="예: 3.5" inputmode="decimal" />

  <label for="years">예치 기간 (년)</label>
  <input type="number" id="years" step="0.1" placeholder="예: 1" inputmode="decimal" />

  <button onclick="calculateInterest()">이자 계산</button>

  <div class="result" id="result"></div>

  <script>
    function calculateInterest() {
      const p = parseFloat(document.getElementById('principal').value);
      const r = parseFloat(document.getElementById('rate').value);
      const y = parseFloat(document.getElementById('years').value);

      if (isNaN(p) || isNaN(r) || isNaN(y)) {
        document.getElementById('result').innerText = '모든 값을 입력해주세요.';
        return;
      }

      const gross = p * (r / 100) * y;
      const net = gross * (1 - 0.154);

      document.getElementById('result').innerHTML =
        `💰 세전 이자: ${gross.toLocaleString()}원<br>💸 세후 이자: ${net.toLocaleString()}원`;
    }
  </script>
</body>
</html>
